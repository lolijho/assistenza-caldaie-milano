[build]
  # Directory contenente il codice sorgente del client
  base = "client"
  
  # Comando per generare la build di produzione
  command = "pnpm run build"
  
  # Directory contenente i file statici generati dalla build
  publish = "dist"

[build.environment]
  # Versione Node.js da utilizzare
  NODE_VERSION = "22.13.0"

# Configurazione per SPA (Single Page Application)
# Reindirizza tutte le richieste all'index.html per gestire il routing client-side
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers di sicurezza e performance
[[headers]]
  for = "/*"
  [headers.values]
    # Sicurezza
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Performance - Cache per asset statici
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Cache aggressiva per asset con hash nel nome
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
